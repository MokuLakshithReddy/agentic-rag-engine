name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-cross-platform:
    name: Base Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run Pytest Suite
      run: |
        pytest tests/ -v

  test-neural-nli-ml:
    name: Neural NLI DeBERTa Verification (Linux, Python 3.11, [ml])
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies including [ml]
      run: |
        python -m pip install --upgrade pip
        pip install .[dev,ml]

    - name: Run Neural NLI DeBERTa Cross-Encoder Inference Tests
      run: |
        pytest tests/unit/test_tenant_and_neural_nli.py -k "neural_nli" -v
