[project]
name = "agentic-rag-engine"
version = "1.0.0"
description = "Autonomous Multi-Step Knowledge Research & Verification Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=7.0.0",
    "black>=24.2.0"
]
ml = [
    "torch>=2.2.0",
    "sentence-transformers>=2.5.0",
    "transformers>=4.38.0"
]
all = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=7.0.0",
    "black>=24.2.0",
    "torch>=2.2.0",
    "sentence-transformers>=2.5.0",
    "transformers>=4.38.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
